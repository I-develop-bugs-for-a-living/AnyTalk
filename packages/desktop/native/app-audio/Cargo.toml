[package]
name = "anytalk-app-audio"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Per-process audio capture (WASAPI process loopback) for the AnyTalk desktop app"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows = { version = "0.62", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
