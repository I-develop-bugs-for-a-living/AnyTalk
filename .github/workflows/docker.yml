name: Docker Image

# Builds the web client image and pushes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest   (every push to main)
#   ghcr.io/<owner>/<repo>:<sha>    (every push, for pinning / rollback)
#   ghcr.io/<owner>/<repo>:1.2.3    (when a v1.2.3 tag is pushed)
#
# Backend URLs are NOT baked in. Set VITE_API_URL etc. as container env vars
# (see docker/inject.js), so the same image works for any Stoat instance.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # GHCR requires lowercase image names; the repo owner contains uppercase letters
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Add linux/arm64 here if your server is ARM (slower, emulated via QEMU;
          # also add a docker/setup-qemu-action@v3 step above)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
